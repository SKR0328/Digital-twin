[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "glycoahead"
version = "0.1.0"
description = "A local research application for personalized glucose event forecasting"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn", "sqlalchemy>=2", "alembic", "scikit-learn", "pandas", "numpy", "joblib", "openpyxl", "xlrd"]

[project.scripts]
glycoahead = "glycoahead.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
glycoahead = ["resources/*.json"]

